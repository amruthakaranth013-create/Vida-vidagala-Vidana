
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vida Vidagala Vidana 🍲</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff8ef;
      text-align: center;
      padding: 25px 15px;
      color: #492b1d;
    }
    h1 { color: #e85d04; }
    input {
      width: 65%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }
    button {
      padding: 12px;
      background: #e85d04;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    #result { margin-top: 25px; }
  </style>
</head>
<body>
  <h1>🍲 Vida Vidagala Vidana</h1>
  <p>Search it. Cook it. Love it! ❤️</p>

  <input id="food" placeholder="Search any food...">
  <button onclick="searchFood()">Search</button>

  <div id="result"></div>

  <script>
    async function searchFood() {
      const food = document.getElementById("food").value.trim();
      const result = document.getElementById("result");

      if (!food) {
        result.textContent = "Please enter a food name!";
        return;
      }

      result.textContent = "Searching recipes... 🍳";

      try {
        const url =
          "https://www.themealdb.com/api/json/v1/1/search.php?s=" +
          encodeURIComponent(food);

        const response = await fetch(url);
        const data = await response.json();

        result.innerHTML = "";

        if (!data.meals) {
          result.textContent =
            "No recipe found. Try another food!";
          return;
        }

        data.meals.forEach(meal => {
          const card = document.createElement("div");
          card.style.margin = "20px auto";
          card.style.padding = "15px";
          card.style.background = "white";
          card.style.borderRadius = "15px";
          card.style.maxWidth = "400px";

          const title = document.createElement("h2");
          title.textContent = meal.strMeal;

          const image = document.createElement("img");
          image.src = meal.strMealThumb;
          image.alt = meal.strMeal;
          image.style.width = "100%";
          image.style.borderRadius = "12px";

          const recipe = document.createElement("button");
          recipe.textContent = "View Recipe";
          recipe.onclick = () => {
            window.open(meal.strSource || meal.strYoutube || "#", "_blank");
          };

          card.append(title, image, recipe);
          result.appendChild(card);
        });
      } catch (error) {
        result.textContent =
          "Connection problem. Please check your internet.";
      }
    }
  </script>
</body>
</html>
